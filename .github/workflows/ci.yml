name: QuickChat CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # =========================
  # SERVER
  # =========================

  server:
    name: Server Tests & Build

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: quickchat
          POSTGRES_PASSWORD: quickchat
          POSTGRES_DB: quickchat

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U quickchat -d quickchat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://quickchat:quickchat@localhost:5432/quickchat
      CLIENT_URL: http://localhost:5173

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx drizzle-kit migrate

      - name: Run tests
        run: npm test

      - name: Build server
        run: npm run build


  # =========================
  # CLIENT
  # =========================

  client:
    name: Client Build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build


  # =========================
  # DOCKER
  # =========================

  docker:
    name: Docker Build

    runs-on: ubuntu-latest

    needs:
      - server
      - client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker stack
        run: docker compose build